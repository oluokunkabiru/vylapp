version: "3.9"

# ════════════════════════════════════════════════════════════════════════════
#  VYLAPP — LOCAL DEVELOPMENT DOCKER COMPOSE
#
#  Brings up:
#    postgres  — PostgreSQL 16 with the Vylapp schema applied automatically
#    backend   — Node.js/Express API on port 4000
#    frontend  — React/Vite dev server on port 5173
#
#  The Flutter mobile app (mobile/) is run natively via `flutter run`.
#  It connects to the backend at the host machine IP (see mobile/README).
#
#  USAGE:
#    cp .env.example backend/.env         # fill in your secrets
#    docker compose up --build
#
#  To apply pending migrations separately after initial setup:
#    docker compose exec backend npx prisma migrate deploy
#  To author a new migration after editing prisma/schema.prisma:
#    docker compose exec backend npx prisma migrate dev --name <description>
# ════════════════════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       vylapp_dev
      POSTGRES_USER:     vylapp
      POSTGRES_PASSWORD: vylappdev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vylapp -d vylapp_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://vylapp:vylappdev@postgres:5432/vylapp_dev
      NODE_ENV:     development
      PORT:         4000
      MAIL_HOST:    mailpit
      MAIL_PORT:    1025
      MAIL_SCHEME:  ""
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/src       # hot-reload in dev; remove :ro in production
      - ./backend/prisma:/app/prisma # so new migrations are picked up without a rebuild
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: >
      sh -c "npx prisma generate && npx prisma migrate deploy && npx tsx src/db/seedReferenceData.ts && npx tsx src/db/seed.ts && npx tsx watch src/server.ts"

  # ── Mailpit (local SMTP catcher — dev only) ─────────────────────────────────
  # Host already runs a native Mailpit on 1025/8025, so this one is mapped to
  # different host ports to avoid clashing. The backend talks to it over the
  # compose network via the container name "mailpit", not these host ports.
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "1026:1025"   # SMTP
      - "8026:8025"   # Web UI

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5180:5173"
    environment:
      - VITE_PORT=5173
      - BACKEND_URL=http://backend:4000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

  # ── DB UI (pgweb) ───────────────────────────────────────────────────────────
  db-ui:
    image: sosedoff/pgweb:latest
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://vylapp:vylappdev@postgres:5432/vylapp_dev?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  frontend_node_modules:
