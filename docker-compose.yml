version: "3.9"

# ════════════════════════════════════════════════════════════════════════════
#  VYLAPP — LOCAL DEVELOPMENT DOCKER COMPOSE
#
#  Brings up:
#    postgres  — PostgreSQL 16 with the Vylapp schema applied automatically
#    backend   — Node.js/Express API on port 4000
#    frontend  — React/Vite dev server on port 5173
#
#  The Flutter mobile app (mobile/) is run natively via `flutter run`.
#  It connects to the backend at the host machine IP (see mobile/README).
#
#  USAGE:
#    cp .env.example backend/.env         # fill in your secrets
#    docker compose up --build
#
#  To apply pending migrations separately after initial setup:
#    docker compose exec backend npx prisma migrate deploy
#  To author a new migration after editing prisma/schema.prisma:
#    docker compose exec backend npx prisma migrate dev --name <description>
# ════════════════════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       vylapp_dev
      POSTGRES_USER:     vylapp
      POSTGRES_PASSWORD: vylappdev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vylapp -d vylapp_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://vylapp:vylappdev@postgres:5432/vylapp_dev
      NODE_ENV:     development
      PORT:         4000
      MAIL_HOST:    mailpit
      MAIL_PORT:    1025
      MAIL_SCHEME:  ""
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/src       # hot-reload in dev; remove :ro in production
      - ./backend/prisma:/app/prisma # so new migrations are picked up without a rebuild
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: >
      sh -c "npx prisma generate && npx prisma migrate deploy && npx tsx src/db/seedReferenceData.ts && npx tsx src/db/seed.ts && npx tsx watch src/server.ts"

  # ── Mailpit (local SMTP catcher — dev only) ─────────────────────────────────
  # Host already runs a native Mailpit on 1025/8025, so this one is mapped to
  # different host ports to avoid clashing. The backend talks to it over the
  # compose network via the container name "mailpit", not these host ports.
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "1026:1025"   # SMTP
      - "8026:8025"   # Web UI

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5180:5173"
    environment:
      - VITE_PORT=5173
      - BACKEND_URL=http://backend:4000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

  # ── DB UI (pgweb) ───────────────────────────────────────────────────────────
  db-ui:
    image: sosedoff/pgweb:latest
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://vylapp:vylappdev@postgres:5432/vylapp_dev?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # ── Prometheus ─────────────────────────────────────────────────────────────
  # Scrapes /metrics off the backend (see src/middleware/metrics.ts) and
  # postgres-exporter below. UI at localhost:9090 — mainly useful for
  # checking a PromQL expression before putting it in a Grafana panel.
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - postgres-exporter

  # ── Postgres exporter ──────────────────────────────────────────────────────
  # Exposes Postgres-internal stats (connections, table sizes, query stats)
  # as Prometheus metrics — the DB has no visibility otherwise, since the
  # backend's own /metrics only covers the Node process.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://vylapp:vylappdev@postgres:5432/vylapp_dev?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Grafana ────────────────────────────────────────────────────────────────
  # Dashboards + datasources are auto-provisioned from monitoring/grafana/ —
  # nothing to click through manually. Login admin / vylappadmin (change
  # this for anything beyond local dev — see GF_SECURITY_ADMIN_PASSWORD).
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: vylappadmin
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  frontend_node_modules:
  prometheus_data:
  grafana_data:
