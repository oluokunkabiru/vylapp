name: vylapp
description: "Vylapp — Vibe. Learn. Connect. Next-generation edutainment and multicultural communities forum."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──────────────────────────────────────────────────────
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.2.0

  # ── Networking ────────────────────────────────────────────────────────────
  dio: ^5.6.0
  socket_io_client: ^2.0.3+1
  connectivity_plus: ^6.0.3

  # ── Security ──────────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  safe_device: ^1.1.0
  local_auth: ^2.3.0

  # ── Firebase (push notifications + crash reporting + analytics) ───────────
  # Web notifications use firebase-messaging-sw.js service worker (see /web)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3
  flutter_local_notifications: ^18.0.1

  # ── Live audio — Spaces ───────────────────────────────────────────────────
  livekit_client: ^2.2.0

  # ── Hardware communication channels ──────────────────────────────────────
  # BLE: flutter_blue_plus is the maintained successor to flutter_blue
  flutter_blue_plus: ^1.31.15
  # USB serial (Arduino, sensors, custom hardware)
  usb_serial: ^0.5.0
  # NFC (contactless ID, payments, attendance)
  nfc_manager: ^3.3.0
  # Platform method channels for custom Kotlin/Swift native code
  # (no package needed — uses Flutter's built-in MethodChannel/EventChannel)

  # ── Data serialisation ────────────────────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ── Dependency injection ──────────────────────────────────────────────────
  get_it: ^7.7.0
  injectable: ^2.4.4

  # ── UI ────────────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2

  # ── Media ─────────────────────────────────────────────────────────────────
  image_picker: ^1.1.2
  video_player: ^2.9.1

  # ── Utilities ─────────────────────────────────────────────────────────────
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora-ExtraBold.ttf
          weight: 800
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
