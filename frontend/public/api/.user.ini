; PHP-FPM/CGI settings for the API proxy (index.php). Leaves request bodies
; unparsed so uploads stream through php://input instead of being buffered
; into $_FILES; limits match the backend's 150 MB media cap.
enable_post_data_reading = Off
post_max_size = 160M
upload_max_filesize = 150M
max_execution_time = 180
output_buffering = Off
zlib.output_compression = Off
